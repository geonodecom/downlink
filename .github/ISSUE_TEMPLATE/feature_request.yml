name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Concrete use cases help more than
        implementation ideas alone.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Downlink to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - Windows
        - Linux
        - Android
        - Browser extension
        - All platforms
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
        - label: This request is about Downlink product behavior, not a security vulnerability.
          required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Mockups, links, or examples that clarify the request.
